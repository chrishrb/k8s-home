---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app <APP>
  namespace: flux-system
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  targetNamespace: <NAMESPACE>
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: "./kubernetes/apps/<NAMESPACE>/<APP>/app"
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: external-secrets # only if the app has an ExternalSecret
    # - name: openebs          # only if it uses persistence / volsync
    # - name: postgres-cluster # only if it uses a database.yaml
  prune: true
  wait: true
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # GATUS_SUBDOMAIN: <APP>   # only with the gatus component
      # VOLSYNC_CAPACITY: 1Gi    # only with the volsync component

---
# <APP>'s own Postgres (CloudNativePG, operator in cnpg-system). The operator
# creates the <APP>-pg-app secret (uri, host, username, password, ...) for the
# <APP> user, which owns the <APP> database.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: <APP>-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  primaryUpdateStrategy: unsupervised
  storage:
    size: 2Gi
    storageClass: openebs-hostpath
  bootstrap:
    initdb:
      database: <APP>
      owner: <APP>
  monitoring:
    enablePodMonitor: true
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi

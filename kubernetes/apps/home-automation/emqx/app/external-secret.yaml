---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emqx
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: emqx-secret
    template:
      engineVersion: v2
      data:
        EMQX_DASHBOARD__DEFAULT_USERNAME: "{{ .EMQX_DASHBOARD__DEFAULT_USERNAME }}"
        EMQX_DASHBOARD__DEFAULT_PASSWORD: "{{ .EMQX_DASHBOARD__DEFAULT_PASSWORD }}"
        X_EMQX_EXPORTER_APIKEY_KEY: "{{ .X_EMQX_EXPORTER_APIKEY_KEY }}"
        X_EMQX_EXPORTER_APIKEY_SECRET: "{{ .X_EMQX_EXPORTER_APIKEY_SECRET }}"
  dataFrom:
    - extract:
        key: "ca4e2800-2336-4cdd-8c42-b1f10169b27a"
---
# EMQX's api_key.bootstrap_file. The operator uses the emqx-operator-controller line
# (no role suffix: it reads everything after the first colon as the secret) and only
# creates this secret itself when it doesn't exist yet.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emqx-bootstrap-api-key
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: emqx-bootstrap-api-key
    template:
      engineVersion: v2
      data:
        bootstrap_api_key: |-
          emqx-operator-controller:{{ .X_EMQX_OPERATOR_APIKEY_SECRET }}
          {{ .X_EMQX_EXPORTER_APIKEY_KEY }}:{{ .X_EMQX_EXPORTER_APIKEY_SECRET }}:viewer
  dataFrom:
    - extract:
        key: "ca4e2800-2336-4cdd-8c42-b1f10169b27a"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: emqx-init-user
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: emqx-init-user-secret
    template:
      engineVersion: v2
      data:
        init-user.json: |
          [{"user_id": "{{ .X_EMQX_MQTT_USERNAME }}", "password": "{{ .X_EMQX_MQTT_PASSWORD }}", "is_superuser": true}]
  dataFrom:
    - extract:
        key: "65858eef-5374-4b35-b953-b1f10169f689"

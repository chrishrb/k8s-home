---
# The Bitwarden secret must be JSON with S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres16-s3
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: postgres16-s3-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY_ID }}"
        ACCESS_SECRET_KEY: "{{ .S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: <BITWARDEN_SECRET_UUID> # TODO: Bitwarden secret holding the S3 credentials
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres16-s3
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://<BUCKET>/postgres16 # TODO: bucket name
    endpointURL: <S3_ENDPOINT_URL> # TODO: e.g. https://s3.eu-central-1.amazonaws.com
    s3Credentials:
      accessKeyId:
        name: postgres16-s3-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres16-s3-secret
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres16-daily
spec:
  schedule: "0 0 3 * * *" # six fields (seconds first): daily at 03:00
  immediate: true
  backupOwnerReference: self
  cluster:
    name: postgres16
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

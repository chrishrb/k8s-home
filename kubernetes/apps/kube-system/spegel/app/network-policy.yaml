---
# The registry hostPort/NodePort is served by Cilium in eBPF, so the Talos firewall
# doesn't see it. Only allow in-cluster clients (containerd connects from the host).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: spegel
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: spegel
  ingress:
    - fromEntities:
        - cluster
        - host
        - remote-node

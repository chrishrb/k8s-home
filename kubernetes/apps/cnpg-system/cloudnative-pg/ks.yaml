---
# CloudNativePG operator and its barman-cloud plugin. Apps run their own
# Postgres `Cluster` in their namespace (e.g. observability/gatus, noonside).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg
  namespace: flux-system
spec:
  targetNamespace: cnpg-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/cnpg-system/cloudnative-pg/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  dependsOn:
    - name: cert-manager # required by plugin-barman-cloud

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: noonside
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: noonside-chart
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # Values: deploy/helm/noonside/values.yaml in github.com/chrishrb/noonside.
  # Everything specific to this installation lives here; secrets come from
  # external-secret.yaml.
  values:
    # Keep in sync with the https-noonside listener in
    # networking/gateway/app/gateway.yaml and the URLs in gatus.yaml. DNS
    # (app.noonside.de A → the node IP) is at IONOS.
    host: app.noonside.de
    annotations:
      reloader.stakater.com/auto: "true"
    api:
      image:
        repository: ghcr.io/chrishrb/noonside-api
      env:
        # Keeps waitlist confirmations from using up Sweego's daily cap, so
        # auth and alert emails always get through.
        WAITLIST_MAILS_PER_HOUR: "3"
    web:
      image:
        repository: ghcr.io/chrishrb/noonside-web
    # Ahead of the chart's default (v2.196.0): v2.197.0 matches the schema of
    # the Supabase project the data came from (MFA recovery codes, SCIM,
    # one_time_tokens.expires_at). Drop once the chart has caught up.
    auth:
      image:
        repository: supabase/gotrue
        tag: v2.197.0
    # Sweego (EU, free plan: 100 emails a day), sending domain
    # mail.noonside.de (its DNS records are at the registrar). The password is
    # SMTP_PASSWORD / GOTRUE_SMTP_PASS.
    smtp:
      host: prod-mta-05.swg-srv.net
      port: 587
      tls: starttls
      user: "e626e5fef3334968a3ce00ac0aa28d36/smtp/5e7e7375-14ce-4838-bbdf-c05484c4e91c"
      from: no-reply@mail.noonside.de
      fromName: noonside
    # Public half of `noonside keygen vapid`; VAPID_PRIVATE_KEY is in Bitwarden.
    vapidPublicKey: "BCgLu9XXpl1_OKjn2hfsEo9fY4IWKeYci9TCYrVYiiHC2yKXPPW0tIu4Z2oQDIbbYe_l5nxWU6Uk5Z88lpr5mSA"
    # Sentry (EU region), projects noonside-api and noonside-web
    # (infra/sentry.tf: tofu -chdir=infra output sentry_dsn_api, sentry_dsn_web).
    # The DSNs are not secret.
    sentry:
      enabled: true
      api:
        dsn: "https://6cc656d29609b0fb8442f60b034129ae@o4512204982255616.ingest.de.sentry.io/4512205226115152"
      web:
        dsn: "https://27e27662cd693ff85289be741764563a@o4512204982255616.ingest.de.sentry.io/4512205226115153"
    media:
      storageClass: openebs-hostpath
    postgres:
      storage:
        storageClass: openebs-hostpath
      backup:
        enabled: true
        s3:
          destinationPath: s3://k8s-home-backup-noonside-905418359817/noonside-pg # infra/backups.tf
          endpointURL: https://s3.eu-central-1.amazonaws.com
          credentials:
            existingSecret: noonside-pg-backup
            regionKey: ACCESS_REGION
    route:
      enabled: true
      parentRefs:
        - name: external
          namespace: networking
          sectionName: https-noonside
    # Hosted FTP for Solar-Logs (SFTPGo): FTP on 21 and the passive ports on
    # the node's public IP (shared with the gateway), allowed in by
    # network-policy.yaml. ftp.noonside.de: A record at IONOS → the node IP.
    hostedFtp:
      enabled: true
      publicHost: ftp.noonside.de
      admin:
        existingSecret: noonside-sftpgo
      ftp:
        forcePassiveIP: "109.205.183.14"
      service:
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        allocateLoadBalancerNodePorts: false
        annotations:
          lbipam.cilium.io/ips: "109.205.183.14"
          lbipam.cilium.io/sharing-key: default
          lbipam.cilium.io/sharing-cross-namespace: "*"
      storage:
        storageClass: openebs-hostpath

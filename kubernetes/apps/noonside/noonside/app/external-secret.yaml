---
# The secrets come from one Bitwarden secret holding JSON with these keys
# (GoTrue's database password and SFTPGo's admin password are generated, see
# noonside-pg-auth and noonside-sftpgo):
#   SECRET_KEY, VAPID_PRIVATE_KEY      the values the AWS deployment had (SSM
#                                      /solar0/prod/…): SECRET_KEY decrypts the
#                                      stored data source passwords
#   SMTP_PASSWORD                      Sweego (API and GoTrue)
#   GOTRUE_JWT_KEYS, GOTRUE_JWT_SECRET,
#   AUTH_SERVICE_ROLE_KEY              `noonside keygen gotrue`
#   (S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY  only once backups are on, see
#                                      noonside-pg-backup below)
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: noonside
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: noonside-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .SECRET_KEY }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"
        VAPID_PRIVATE_KEY: "{{ .VAPID_PRIVATE_KEY }}"
        AUTH_SERVICE_ROLE_KEY: "{{ .AUTH_SERVICE_ROLE_KEY }}"
  dataFrom:
    - extract:
        key: 32330463-f274-4840-9d80-b4f100e1d520 # Bitwarden secret "noonside"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: noonside-auth
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: noonside-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GOTRUE_JWT_KEYS: "{{ .GOTRUE_JWT_KEYS }}"
        GOTRUE_JWT_SECRET: "{{ .GOTRUE_JWT_SECRET }}"
        GOTRUE_SMTP_PASS: "{{ .SMTP_PASSWORD }}"
  dataFrom:
    - extract:
        key: 32330463-f274-4840-9d80-b4f100e1d520 # Bitwarden secret "noonside"
---
# GoTrue's database role: the password is generated in the cluster (once,
# refreshInterval 0) and CNPG sets it on the role. It is only in the cluster:
# after a rebuild a new one is generated and CNPG resets the role, so it needs
# no backup. Letters and digits only, it goes into GoTrue's database URL.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: noonside-pg-auth
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: noonside-pg-auth
spec:
  refreshInterval: "0"
  target:
    name: noonside-pg-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: supabase_auth_admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: noonside-pg-auth
---
# SFTPGo's admin account (hosted FTP), used by SFTPGo and the API. Generated
# once; SFTPGo keeps it in its own database, so it must not rotate.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: noonside-sftpgo
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: noonside-sftpgo
spec:
  refreshInterval: "0"
  target:
    name: noonside-sftpgo
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SFTPGO_ADMIN_PASSWORD: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: noonside-sftpgo
---
# Backups are off for now (postgres.backup.enabled in helm-release.yaml).
# To turn them on: add S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY to the
# Bitwarden secret, uncomment this and enable the backup.
